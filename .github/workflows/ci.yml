name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      # THE ONLY SIBLING THIS CRATE NEEDS, AND THAT IS THE POINT.
      # chores.yml:11 says `staticlib` is the whole interface a consumer
      # needs; a second checkout here would let a path dependency on a
      # second sibling pass CI while breaking every consumer who
      # provisioned from that sentence. rust-partitions used to be
      # checked out below and is not any more -- am-partitions comes
      # from the registry. See #69, and
      # tests/siblings_the_contract_promises.rs.
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: build
        working-directory: rust-img-qcow2
        run: cargo build --locked --all-targets
      - name: test
        working-directory: rust-img-qcow2
        # QUIET BY DEFAULT: the whole run goes to tmp/logs/debug.log and is
        # uploaded below; this step prints a verdict line and the executed-test
        # count. A failure prints the tail of the log. See the measured budget
        # table at the top of chores.yml, and scripts/tier.sh.
        #
        # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
        # This run has no `--release`, so overflow-checks are on, and it is
        # what makes every arithmetic test in this crate mean anything. The
        # variable tells `overflow_checks::the_build_the_gate_asked_to_check
        # _does_check` in src/lib.rs that THIS is the run that must trap an
        # overflow. It is an `env:` mapping rather than an inline prefix
        # because this job also runs on windows-latest. Do not add `--release`
        # and do not drop the variable: tests/ci_profile.rs fails if no
        # `cargo test` here runs without `--release` while setting it (#60).
        #
        # THE FLOOR, BECAUSE THE FAILURE MODE HERE IS AN ABSENCE (#99).
        # `cargo test` exits 0 on "0 passed; 0 failed", so a filter that
        # selects nothing, a build that produced no test binaries, and a suite
        # that ran in full all report the same green -- and the empty run is
        # also the one that fits its output budget best. Measured 2026-09-19
        # on an arm64 Linux host: 248 executed on each runner. The floor is
        # 225, roughly a tenth below, so deleting a test does not turn the gate
        # red while a run that stopped early does. It only ever goes up: it was
        # 205 against 226 on run 35294153437 before the output-budget guards
        # added eighteen tests. A COUNT ANSWERS "DID ANYTHING RUN", NOT "DID IT
        # CHECK ANYTHING" -- a test that returns early because a tool is
        # missing still counts as passed, which is what #97 was.
        #
        # `shell: bash` on every runner, because the tier scripts are bash.
        shell: bash
        run: |
          bash scripts/tier.sh "test (debug)" debug 420 28000 -- cargo test --locked --all-targets
          bash scripts/test-floor.sh debug 225
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      - name: keep the tier log
        # `always()`, so the log survives the failure it exists to explain.
        # A failing tier already prints its tail into this job log; this is
        # what keeps the whole run once the runner is gone.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-test-${{ matrix.os }}
          path: rust-img-qcow2/tmp/logs/
          if-no-files-found: warn
          retention-days: 7
      - name: clippy
        working-directory: rust-img-qcow2
        run: cargo clippy --locked --all-targets -- -D warnings

  # A 32-bit target, because some defects only exist there: a `u64` narrowed
  # with `as usize` keeps its low 32 bits, and on a 64-bit runner every
  # `u64` fits, so the test for it is `#[cfg(target_pointer_width = "32")]`
  # and compiles out of every other job (#62). Library unit tests only.
  test-32bit:
    name: test / i686-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - name: install a 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: lib tests (32-bit)
        working-directory: rust-img-qcow2
        # ITS OWN TIER, ITS OWN BUDGET AND ITS OWN FLOOR, BECAUSE THIS
        # SELECTION CAN EMPTY ON ITS OWN. `--lib` on a 32-bit target compiles
        # the `#[cfg(target_pointer_width = "32")]` tests that no other job in
        # this workflow builds, and drops every integration target the matrix
        # runs. Either set can empty without touching the other -- a missing
        # `rustup target add`, a cfg that stops matching, or a `--target` that
        # no longer resolves would leave this job green having compiled
        # nothing to run.
        #
        # Measured 2026-09-17 on run 35174965656 (main, df6a954): 42 executed,
        # one more than the 41 the 64-bit legs run, and that one is the whole
        # reason this job exists. Floor 38.
        shell: bash
        run: |
          bash scripts/tier.sh "test (32-bit lib)" lib32 200 14000 -- cargo test --locked --lib --target i686-unknown-linux-gnu
          bash scripts/test-floor.sh lib32 38
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-lib32
          path: rust-img-qcow2/tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  # THE PROFILE THAT SHIPS IS NOT THE PROFILE THE TESTS RUN IN (#98).
  #
  # Every `cargo test` above this line builds the `test` profile, which
  # inherits from `dev`: `opt-level = 1`, no LTO, `codegen-units` at the
  # default, `debug_assert!` bodies live and overflow checks on. The
  # crate published to crates.io is built with `[profile.release]` --
  # `lto = true`, `codegen-units = 1`, `opt-level = 3` -- and until now
  # nothing ran a single test against it.
  #
  # The two profiles do not agree on behaviour, and the disagreements
  # are in this crate's blast radius:
  #
  #   * `debug_assert!` bodies vanish under `--release`. An invariant
  #     the debug run enforces is unchecked in the shipped build, and
  #     the failure moves from a panic to whatever the following code
  #     does with the bad value. `patch_be` in tests/synthetic.rs and
  #     several sites in the reader rely on them.
  #   * ARITHMETIC WRAPS INSTEAD OF PANICKING, which is the inverse of
  #     the debug job's job above. A test guarding a wrapping
  #     computation passes the debug run for the WRONG REASON -- the
  #     panic -- while the behaviour it guards against is live in the
  #     built library. `rust-fs-ntfs` recorded exactly this:
  #     `signed_bytes_needed` negated `i64::MIN`, panicked in debug,
  #     wrapped in release, and the wrap happened to reach the right
  #     answer. Four tests ran in CI and could not fail there.
  #   * `lto = true` and `codegen-units = 1` change inlining across the
  #     C ABI boundary, which is where `panic = "unwind"` and
  #     `catch_unwind` are load-bearing here -- Cargo.toml's own comment
  #     on that key says so.
  #
  # So this is not a duplicate of the matrix above and must not be
  # tidied into one. The matrix is the only run that can SEE an
  # overflow; this is the only run that tests what we PUBLISH. Deleting
  # either leaves a whole class of defect with no run that could catch
  # it before release.
  #
  # ONE RUNNER RATHER THAN THE MATRIX. Overflow behaviour and
  # optimisation are properties of the profile, not of the platform, and
  # three of these would buy the same evidence three times on a crate
  # whose cross-platform risk the debug matrix already covers. The
  # siblings rust-img-vhdx, rust-img-vmdk and rust-partitions all made
  # the same call.
  #
  # NO `EXPECT_OVERFLOW_CHECKS` HERE, DELIBERATELY. Overflow checks are
  # meant to be off under `--release` -- that is what ships -- and
  # `overflow_checks::the_build_the_gate_asked_to_check_does_check` in
  # src/lib.rs fails when the handshake is set and the build does not
  # trap. Setting it here would turn a correct release run red on every
  # green build.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      # The same single sibling the matrix checks out, for the same
      # reason: chores.yml:11 says `staticlib` is the whole interface a
      # consumer needs, and tests/siblings_the_contract_promises.rs
      # refuses a path dependency on any sibling the contract does not
      # declare. Cargo builds the resolve graph for every command, so
      # this directory has to exist here exactly as it does above.
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: test --release
        working-directory: rust-img-qcow2
        # ITS OWN TIER, NOT THE MATRIX'S, BECAUSE THIS IS A DIFFERENT RUN
        # SELECTION. It builds the same targets today and counts the same
        # number, but it is a separate `cargo test` in a separate profile: a
        # release-only build failure, a `#[cfg(debug_assertions)]` that takes
        # a module out of the release build, or a future narrowing of this
        # command empties this run without touching the matrix, and one shared
        # number would be satisfied by the other job while proving nothing
        # about this one.
        #
        # Measured 2026-09-19 on this host: 248 executed, the same number the
        # debug matrix ran and deliberately counted separately from it. Floor
        # 225, roughly a tenth below, so deleting a test does not turn the gate
        # red while a run that stopped early does. It moves up with the suite
        # and never down: it was 205 against 226 before the output-budget
        # guards added eighteen tests.
        shell: bash
        run: |
          bash scripts/tier.sh "test (release)" release 420 28000 -- cargo test --locked --release --all-targets
          bash scripts/test-floor.sh release 225
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-release
          path: rust-img-qcow2/tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        working-directory: rust-img-qcow2
        run: cargo fmt --check
      - name: the one required check stands for every job
        run: scripts/ci-gate.sh
      - name: the agent guide carries the shared block
        # AGENTS.md embeds agent-core, byte-identical with every sibling. This
        # runs the script directly rather than through `chore lint`, because
        # CI here does not install chore -- a guard wired only into a task
        # nothing runs is a guard that reports protection it is not providing.
        run: scripts/agents-core-check.sh

  # Cross-validates our reader/writer against `qemu-img`. qemu-img is
  # invoked as a subprocess only — never linked, never bundled. The
  # qemu-utils package is installed only on the CI runner.
  qemu-validation:
    name: qemu-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - name: install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: qemu cross-validation tests
        working-directory: rust-img-qcow2
        # THE MOST EXPOSED SELECTION IN THE FILE, so it has the loudest
        # floor. `--test qemu_validation` names a target: rename
        # tests/qemu_validation.rs, or the `[[test]]` entry in Cargo.toml that
        # gives it that name, and the selection matches nothing. `cargo test`
        # then exits 0 having run no test, this job reports green, and the
        # crate's only cross-validation against `qemu-img` -- the thing that
        # decides whether the images we write are qcow2 rather than merely
        # self-consistent -- silently stops running. The feature gate makes
        # that more likely, not less: the `[[test]]` entry requires
        # `qemu-validation`, so the matrix's `--all-targets` does not build
        # this target and nothing else would notice (#50, #99).
        #
        # Measured 2026-09-18 on run 35294153437 (PR #102, 909ec72): 25
        # executed. Floor 23.
        #
        # The floor counts what RAN, not what checked, and no number can fix a
        # test that returns early when its tool is missing. Nothing in this
        # file does that any more: the helpers go through `run_qemu`, which
        # panics naming the package when `qemu-img` cannot be spawned (#97).
        #
        # THE JOB ITSELF IS GUARDED TOO.
        # `the_pr_gate_still_cross_validates_against_qemu_img` in
        # tests/ci_profile.rs reads this file and fails unless a gating job
        # named `qemu-validation` installs `qemu-utils` and runs `--features
        # qemu-validation --test qemu_validation`.
        shell: bash
        run: |
          bash scripts/tier.sh qemu-validation qemu 130 9000 -- cargo test --locked --features qemu-validation --test qemu_validation
          bash scripts/test-floor.sh qemu 23
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-qemu
          path: rust-img-qcow2/tmp/logs/
          if-no-files-found: warn
          retention-days: 7
      # The test job's `--all-targets` no longer builds this target: its
      # [[test]] entry requires the feature (#50). So it is linted here,
      # where it is built.
      - name: clippy (qemu cross-validation tests)
        working-directory: rust-img-qcow2
        run: cargo clippy --locked --features qemu-validation --test qemu_validation -- -D warnings

  # ONE CHECK GATES A MERGE, AND IT STANDS FOR EVERY JOB (#104).
  #
  # Branch protection names checks, and a check is a job name, so the
  # required list is a copy of those names kept in a different system
  # from the file that produces them. Rename a job and the required
  # check is a name nothing reports — permanently pending, nothing
  # merges, no failure to point at. Add one and it gates nobody.
  #
  # `if: always()` because a job that was cancelled or skipped is not a
  # job that passed, and an aggregate that only ran when its needs
  # succeeded would be skipped itself — and a skipped required check
  # never reports at all.
  ci-ok:
    name: ci-ok
    needs: [test, test-32bit, test-release, fmt, qemu-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every gating job must have concluded success
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "test-32bit: ${{ needs.test-32bit.result }}"
          echo "test-release: ${{ needs.test-release.result }}"
          echo "fmt: ${{ needs.fmt.result }}"
          echo "qemu-validation: ${{ needs.qemu-validation.result }}"
          failed=0
          for one in "test:${{ needs.test.result }}" \
                     "test-32bit:${{ needs.test-32bit.result }}" \
                     "test-release:${{ needs.test-release.result }}" \
                     "fmt:${{ needs.fmt.result }}" \
                     "qemu-validation:${{ needs.qemu-validation.result }}"; do
              job=${one%%:*}
              result=${one#*:}
              if [ "$result" != "success" ]; then
                  echo "::error::$job concluded '$result', not 'success' -- failure, cancellation and skipping all mean the gate did not run to completion"
                  failed=1
              fi
          done
          [ "$failed" = 0 ] || exit 1
          echo "all gating jobs succeeded"
