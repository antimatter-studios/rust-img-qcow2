name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      # THE ONLY SIBLING THIS CRATE NEEDS, AND THAT IS THE POINT.
      # chores.yml:11 says `staticlib` is the whole interface a consumer
      # needs; a second checkout here would let a path dependency on a
      # second sibling pass CI while breaking every consumer who
      # provisioned from that sentence. rust-partitions used to be
      # checked out below and is not any more -- am-partitions comes
      # from the registry. See #69, and
      # tests/siblings_the_contract_promises.rs.
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: build
        working-directory: rust-img-qcow2
        run: cargo build --locked --all-targets
      - name: test
        working-directory: rust-img-qcow2
        # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
        # This run has no `--release`, so overflow-checks are on, and it
        # is what makes every arithmetic test in this crate mean anything.
        #
        # The variable tells `overflow_checks::the_build_the_gate_asked_to
        # _check_does_check` in src/lib.rs that THIS is the run that must
        # trap an overflow -- asking the build directly rather than
        # inferring it from which spellings of "disabled" happen to be
        # absent from Cargo.toml. It is declared as an `env:` mapping
        # rather than inline as `VAR=1 cargo test`. That was originally
        # because this job also runs on windows-latest, where the prefix
        # is a PowerShell syntax error; the step now asks for
        # `shell: bash` on every runner (the floor below needs `awk`),
        # and the mapping stays because it reaches the run wherever the
        # run sits in the script, which an inline prefix does not.
        #
        # Do not add `--release` to this run, and do not drop the
        # variable: tests/ci_profile.rs reads this file and fails if no
        # `cargo test` in it runs without `--release` while setting this.
        # See #60.
        shell: bash
        run: |
          # A FLOOR, BECAUSE THE FAILURE MODE HERE IS AN ABSENCE (#99).
          # `cargo test` exits 0 on "0 passed; 0 failed", so a filter that
          # selects nothing, a build that produced no test binaries, and a
          # suite that ran in full all report the same green. Nothing in
          # this workflow could tell them apart, because nothing counted.
          #
          # Measured 2026-09-18 on run 35294153437 (PR #102, 909ec72):
          # 226 executed on each of the three runners -- 41 library unit
          # tests plus 111, 51, 15, 6 and 2 across the integration
          # targets. The floor is 205, roughly a tenth below, so deleting
          # a test does not turn the gate red while a run that stopped
          # early does. It moves up with the suite and never down: it was
          # 190 against 210 on run 35174965656 (main, df6a954), and the
          # suite grew by the seventeen guards tests/ci_profile.rs gained
          # for #97, less the one test #97 moved out of
          # tests/synthetic.rs and into tests/qemu_validation.rs.
          #
          # THE OUTPUT IS REDIRECTED RATHER THAN PIPED THROUGH `tee`, and
          # that is not a style choice. tests/ci_profile.rs refuses a
          # `cargo test` whose exit status the step does not read, and
          # Actions runs a step's shell without `pipefail`, so
          # `cargo test | tee` would report tee's status -- turning the
          # one run that can see an arithmetic overflow into an advisory
          # one, which is the exact defect that file exists to prevent.
          # The `trap` puts the suite's output back on the step's log.
          # It also means the count does not run after a FAILED suite:
          # `set -e` ends the step at the run, which is right -- a red
          # suite is already red, and this floor is here for a green one.
          #
          # A COUNT ANSWERS "DID ANYTHING RUN", NOT "DID IT CHECK
          # ANYTHING". A test that returns early because a tool is
          # missing still counts as passed, which is what #97 was: a
          # `qemu-img` probe in tests/synthetic.rs that returned on
          # every runner in every job because only the qemu-validation
          # job installs qemu-utils, and this count could not see it.
          # That test now lives in tests/qemu_validation.rs, where the
          # tool's absence is a panic rather than a pass.
          log=$(mktemp)
          trap 'cat "$log"' EXIT
          cargo test --locked --all-targets > "$log" 2>&1
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 205)"
          if [ "$n" -lt 205 ]; then
              echo "::error::only $n tests executed, floor is 205 — 226 ran on 2026-09-18 in run 35294153437, and a run that executes less than that stopped early rather than passed"
              exit 1
          fi
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      - name: clippy
        working-directory: rust-img-qcow2
        run: cargo clippy --locked --all-targets -- -D warnings

  # A 32-bit target, because some defects only exist there: a `u64` narrowed
  # with `as usize` keeps its low 32 bits, and on a 64-bit runner every
  # `u64` fits, so the test for it is `#[cfg(target_pointer_width = "32")]`
  # and compiles out of every other job (#62). Library unit tests only.
  test-32bit:
    name: test / i686-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - name: install a 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: lib tests (32-bit)
        working-directory: rust-img-qcow2
        run: |
          # ITS OWN FLOOR, BECAUSE THIS SELECTION CAN EMPTY ON ITS OWN.
          # See the floor in the `test` job above for why a count is the
          # only thing that can see an absence. This run needs a separate
          # number because it selects a different set: `--lib` on a
          # 32-bit target compiles the `#[cfg(target_pointer_width =
          # "32")]` tests that no other job in this workflow builds, and
          # drops every integration target the matrix runs. Either set
          # can empty without touching the other -- a missing
          # `rustup target add`, a cfg that stops matching, or a
          # `--target` that no longer resolves would leave this job
          # green having compiled nothing to run.
          #
          # Measured 2026-09-17 on run 35174965656 (main, df6a954): 42
          # executed, one more than the 41 the 64-bit legs run, and that
          # one is the whole reason this job exists. Floor 38.
          log=$(mktemp)
          trap 'cat "$log"' EXIT
          cargo test --locked --lib --target i686-unknown-linux-gnu > "$log" 2>&1
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 38)"
          if [ "$n" -lt 38 ]; then
              echo "::error::only $n tests executed, floor is 38 — 42 ran on 2026-09-17 in run 35174965656, and a run that executes less than that stopped early rather than passed"
              exit 1
          fi

  # THE PROFILE THAT SHIPS IS NOT THE PROFILE THE TESTS RUN IN (#98).
  #
  # Every `cargo test` above this line builds the `test` profile, which
  # inherits from `dev`: `opt-level = 1`, no LTO, `codegen-units` at the
  # default, `debug_assert!` bodies live and overflow checks on. The
  # crate published to crates.io is built with `[profile.release]` --
  # `lto = true`, `codegen-units = 1`, `opt-level = 3` -- and until now
  # nothing ran a single test against it.
  #
  # The two profiles do not agree on behaviour, and the disagreements
  # are in this crate's blast radius:
  #
  #   * `debug_assert!` bodies vanish under `--release`. An invariant
  #     the debug run enforces is unchecked in the shipped build, and
  #     the failure moves from a panic to whatever the following code
  #     does with the bad value. `patch_be` in tests/synthetic.rs and
  #     several sites in the reader rely on them.
  #   * ARITHMETIC WRAPS INSTEAD OF PANICKING, which is the inverse of
  #     the debug job's job above. A test guarding a wrapping
  #     computation passes the debug run for the WRONG REASON -- the
  #     panic -- while the behaviour it guards against is live in the
  #     built library. `rust-fs-ntfs` recorded exactly this:
  #     `signed_bytes_needed` negated `i64::MIN`, panicked in debug,
  #     wrapped in release, and the wrap happened to reach the right
  #     answer. Four tests ran in CI and could not fail there.
  #   * `lto = true` and `codegen-units = 1` change inlining across the
  #     C ABI boundary, which is where `panic = "unwind"` and
  #     `catch_unwind` are load-bearing here -- Cargo.toml's own comment
  #     on that key says so.
  #
  # So this is not a duplicate of the matrix above and must not be
  # tidied into one. The matrix is the only run that can SEE an
  # overflow; this is the only run that tests what we PUBLISH. Deleting
  # either leaves a whole class of defect with no run that could catch
  # it before release.
  #
  # ONE RUNNER RATHER THAN THE MATRIX. Overflow behaviour and
  # optimisation are properties of the profile, not of the platform, and
  # three of these would buy the same evidence three times on a crate
  # whose cross-platform risk the debug matrix already covers. The
  # siblings rust-img-vhdx, rust-img-vmdk and rust-partitions all made
  # the same call.
  #
  # NO `EXPECT_OVERFLOW_CHECKS` HERE, DELIBERATELY. Overflow checks are
  # meant to be off under `--release` -- that is what ships -- and
  # `overflow_checks::the_build_the_gate_asked_to_check_does_check` in
  # src/lib.rs fails when the handshake is set and the build does not
  # trap. Setting it here would turn a correct release run red on every
  # green build.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      # The same single sibling the matrix checks out, for the same
      # reason: chores.yml:11 says `staticlib` is the whole interface a
      # consumer needs, and tests/siblings_the_contract_promises.rs
      # refuses a path dependency on any sibling the contract does not
      # declare. Cargo builds the resolve graph for every command, so
      # this directory has to exist here exactly as it does above.
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: test --release
        working-directory: rust-img-qcow2
        shell: bash
        run: |
          # ITS OWN FLOOR, NOT THE MATRIX'S, BECAUSE THIS IS A DIFFERENT
          # RUN SELECTION. It builds the same targets today and counts
          # the same number, but it is a separate `cargo test` in a
          # separate profile: a release-only build failure, a
          # `#[cfg(debug_assertions)]` that takes a module out of the
          # release build, or a future narrowing of this command empties
          # this run without touching the matrix, and one shared number
          # would be satisfied by the other job while proving nothing
          # about this one. See the floor in the `test` job above for
          # why a green `cargo test` is not evidence on its own, and why
          # the output is redirected rather than piped through `tee`.
          #
          # Measured 2026-09-18 on run 35294153437 (PR #102, 909ec72):
          # 226 executed, the same number the debug matrix ran in the
          # same run and deliberately counted separately from it. Floor
          # 205, roughly a tenth below, so deleting a test does not turn
          # the gate red while a run that stopped early does. It moves up
          # with the suite and never down.
          log=$(mktemp)
          trap 'cat "$log"' EXIT
          cargo test --locked --release --all-targets > "$log" 2>&1
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 205)"
          if [ "$n" -lt 205 ]; then
              echo "::error::only $n release-profile tests executed, floor is 205 — 226 ran on 2026-09-18 in run 35294153437, and a run that executes less than that stopped early rather than passed"
              exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        working-directory: rust-img-qcow2
        run: cargo fmt --check

  # Cross-validates our reader/writer against `qemu-img`. qemu-img is
  # invoked as a subprocess only — never linked, never bundled. The
  # qemu-utils package is installed only on the CI runner.
  qemu-validation:
    name: qemu-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - name: install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: qemu cross-validation tests
        working-directory: rust-img-qcow2
        run: |
          # ITS OWN FLOOR, AND THE MOST EXPOSED SELECTION IN THE FILE.
          # `--test qemu_validation` names a target: rename
          # tests/qemu_validation.rs, or the `[[test]]` entry in
          # Cargo.toml that gives it that name, and the selection matches
          # nothing. `cargo test` then exits 0 having run no test, this
          # job reports green, and the crate's only cross-validation
          # against `qemu-img` -- the thing that decides whether the
          # images we write are qcow2 rather than merely self-consistent
          # -- silently stops running. The feature gate makes that more
          # likely, not less: the `[[test]]` entry requires
          # `qemu-validation`, so the matrix's `--all-targets` does not
          # build this target and nothing else would notice (#50, #99).
          #
          # Measured 2026-09-18 on run 35294153437 (PR #102, 909ec72): 25
          # executed. Floor 23 -- the same margin of two as the 24-against-
          # 22 it replaces. The twenty-fifth is the test #97 moved here
          # from tests/synthetic.rs, where it had never run.
          #
          # The floor counts what RAN, not what checked, and no number
          # can fix a test that returns early when its tool is missing.
          # Nothing in this file does that any more: the helpers here go
          # through `run_qemu`, which panics naming the package when
          # `qemu-img` cannot be spawned. That was #97.
          #
          # THE JOB ITSELF IS NOW GUARDED TOO.
          # `the_pr_gate_still_cross_validates_against_qemu_img` in
          # tests/ci_profile.rs reads this file and fails unless a
          # gating job named `qemu-validation` installs `qemu-utils`
          # and runs `--features qemu-validation --test
          # qemu_validation`. Before it, deleting this whole job left
          # every test in the repository green -- the floor goes with
          # the step it lives in.
          log=$(mktemp)
          trap 'cat "$log"' EXIT
          cargo test --locked --features qemu-validation --test qemu_validation > "$log" 2>&1
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 23)"
          if [ "$n" -lt 23 ]; then
              echo "::error::only $n qemu cross-validation tests executed, floor is 23 — 25 ran on 2026-09-18 in run 35294153437, and a run that executes less than that stopped early rather than passed"
              exit 1
          fi
      # The test job's `--all-targets` no longer builds this target: its
      # [[test]] entry requires the feature (#50). So it is linted here,
      # where it is built.
      - name: clippy (qemu cross-validation tests)
        working-directory: rust-img-qcow2
        run: cargo clippy --locked --features qemu-validation --test qemu_validation -- -D warnings

  # ONE CHECK GATES A MERGE, AND IT STANDS FOR EVERY JOB (#104).
  #
  # Branch protection names checks, and a check is a job name, so the
  # required list is a copy of those names kept in a different system
  # from the file that produces them. Rename a job and the required
  # check is a name nothing reports — permanently pending, nothing
  # merges, no failure to point at. Add one and it gates nobody.
  #
  # `if: always()` because a job that was cancelled or skipped is not a
  # job that passed, and an aggregate that only ran when its needs
  # succeeded would be skipped itself — and a skipped required check
  # never reports at all.
  ci-ok:
    name: ci-ok
    needs: [test, test-32bit, test-release, fmt, qemu-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every gating job must have concluded success
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "test-32bit: ${{ needs.test-32bit.result }}"
          echo "test-release: ${{ needs.test-release.result }}"
          echo "fmt: ${{ needs.fmt.result }}"
          echo "qemu-validation: ${{ needs.qemu-validation.result }}"
          failed=0
          for one in "test:${{ needs.test.result }}" \
                     "test-32bit:${{ needs.test-32bit.result }}" \
                     "test-release:${{ needs.test-release.result }}" \
                     "fmt:${{ needs.fmt.result }}" \
                     "qemu-validation:${{ needs.qemu-validation.result }}"; do
              job=${one%%:*}
              result=${one#*:}
              if [ "$result" != "success" ]; then
                  echo "::error::$job concluded '$result', not 'success' -- failure, cancellation and skipping all mean the gate did not run to completion"
                  failed=1
              fi
          done
          [ "$failed" = 0 ] || exit 1
          echo "all gating jobs succeeded"
