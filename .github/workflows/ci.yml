name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      # THE ONLY SIBLING THIS CRATE NEEDS, AND THAT IS THE POINT.
      # chores.yml:11 says `staticlib` is the whole interface a consumer
      # needs; a second checkout here would let a path dependency on a
      # second sibling pass CI while breaking every consumer who
      # provisioned from that sentence. rust-partitions used to be
      # checked out below and is not any more -- am-partitions comes
      # from the registry. See #69, and
      # tests/siblings_the_contract_promises.rs.
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: build
        working-directory: rust-img-qcow2
        run: cargo build --locked --all-targets
      - name: test
        working-directory: rust-img-qcow2
        # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
        # This run has no `--release`, so overflow-checks are on, and it
        # is what makes every arithmetic test in this crate mean anything.
        #
        # The variable tells `overflow_checks::the_build_the_gate_asked_to
        # _check_does_check` in src/lib.rs that THIS is the run that must
        # trap an overflow -- asking the build directly rather than
        # inferring it from which spellings of "disabled" happen to be
        # absent from Cargo.toml. It is declared as an `env:` mapping
        # rather than inline as `VAR=1 cargo test`. That was originally
        # because this job also runs on windows-latest, where the prefix
        # is a PowerShell syntax error; the step now asks for
        # `shell: bash` on every runner (the floor below needs `awk`),
        # and the mapping stays because it reaches the run wherever the
        # run sits in the script, which an inline prefix does not.
        #
        # Do not add `--release` to this run, and do not drop the
        # variable: tests/ci_profile.rs reads this file and fails if no
        # `cargo test` in it runs without `--release` while setting this.
        # See #60.
        shell: bash
        run: |
          # A FLOOR, BECAUSE THE FAILURE MODE HERE IS AN ABSENCE (#99).
          # `cargo test` exits 0 on "0 passed; 0 failed", so a filter that
          # selects nothing, a build that produced no test binaries, and a
          # suite that ran in full all report the same green. Nothing in
          # this workflow could tell them apart, because nothing counted.
          #
          # Measured 2026-09-17 on run 35174965656 (main, df6a954): 210
          # executed on each of the three runners -- 41 library unit tests
          # plus 94, 52, 15, 6 and 2 across the integration targets. The
          # floor is 190, roughly a tenth below, so deleting a test does
          # not turn the gate red while a run that stopped early does. It
          # moves up with the suite and never down.
          #
          # THE OUTPUT IS REDIRECTED RATHER THAN PIPED THROUGH `tee`, and
          # that is not a style choice. tests/ci_profile.rs refuses a
          # `cargo test` whose exit status the step does not read, and
          # Actions runs a step's shell without `pipefail`, so
          # `cargo test | tee` would report tee's status -- turning the
          # one run that can see an arithmetic overflow into an advisory
          # one, which is the exact defect that file exists to prevent.
          # The `trap` puts the suite's output back on the step's log.
          # It also means the count does not run after a FAILED suite:
          # `set -e` ends the step at the run, which is right -- a red
          # suite is already red, and this floor is here for a green one.
          #
          # A count answers "did anything run", not "did it check
          # anything": a test that returns early because a tool is
          # missing still counts as passed (#97).
          log=$(mktemp)
          trap 'cat "$log"' EXIT
          cargo test --locked --all-targets > "$log" 2>&1
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 190)"
          if [ "$n" -lt 190 ]; then
              echo "::error::only $n tests executed, floor is 190 — 210 ran on 2026-09-17 in run 35174965656, and a run that executes less than that stopped early rather than passed"
              exit 1
          fi
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      - name: clippy
        working-directory: rust-img-qcow2
        run: cargo clippy --locked --all-targets -- -D warnings

  # A 32-bit target, because some defects only exist there: a `u64` narrowed
  # with `as usize` keeps its low 32 bits, and on a 64-bit runner every
  # `u64` fits, so the test for it is `#[cfg(target_pointer_width = "32")]`
  # and compiles out of every other job (#62). Library unit tests only.
  test-32bit:
    name: test / i686-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - name: install a 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-multilib
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: lib tests (32-bit)
        working-directory: rust-img-qcow2
        run: |
          # ITS OWN FLOOR, BECAUSE THIS SELECTION CAN EMPTY ON ITS OWN.
          # See the floor in the `test` job above for why a count is the
          # only thing that can see an absence. This run needs a separate
          # number because it selects a different set: `--lib` on a
          # 32-bit target compiles the `#[cfg(target_pointer_width =
          # "32")]` tests that no other job in this workflow builds, and
          # drops every integration target the matrix runs. Either set
          # can empty without touching the other -- a missing
          # `rustup target add`, a cfg that stops matching, or a
          # `--target` that no longer resolves would leave this job
          # green having compiled nothing to run.
          #
          # Measured 2026-09-17 on run 35174965656 (main, df6a954): 42
          # executed, one more than the 41 the 64-bit legs run, and that
          # one is the whole reason this job exists. Floor 38.
          log=$(mktemp)
          trap 'cat "$log"' EXIT
          cargo test --locked --lib --target i686-unknown-linux-gnu > "$log" 2>&1
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 38)"
          if [ "$n" -lt 38 ]; then
              echo "::error::only $n tests executed, floor is 38 — 42 ran on 2026-09-17 in run 35174965656, and a run that executes less than that stopped early rather than passed"
              exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        working-directory: rust-img-qcow2
        run: cargo fmt --check

  # Cross-validates our reader/writer against `qemu-img`. qemu-img is
  # invoked as a subprocess only — never linked, never bundled. The
  # qemu-utils package is installed only on the CI runner.
  qemu-validation:
    name: qemu-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-qcow2
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.2.10
          path: rust-fs-core
      - name: install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-qcow2
      - name: qemu cross-validation tests
        working-directory: rust-img-qcow2
        run: |
          # ITS OWN FLOOR, AND THE MOST EXPOSED SELECTION IN THE FILE.
          # `--test qemu_validation` names a target: rename
          # tests/qemu_validation.rs, or the `[[test]]` entry in
          # Cargo.toml that gives it that name, and the selection matches
          # nothing. `cargo test` then exits 0 having run no test, this
          # job reports green, and the crate's only cross-validation
          # against `qemu-img` -- the thing that decides whether the
          # images we write are qcow2 rather than merely self-consistent
          # -- silently stops running. The feature gate makes that more
          # likely, not less: the `[[test]]` entry requires
          # `qemu-validation`, so the matrix's `--all-targets` does not
          # build this target and nothing else would notice (#50, #99).
          #
          # Measured 2026-09-17 on run 35174965656 (main, df6a954): 24
          # executed. Floor 22.
          #
          # The floor counts what RAN, not what checked: a test here that
          # returns early because `qemu-img` is absent still reports as
          # passed, which is #97 and is not fixed by a number.
          log=$(mktemp)
          trap 'cat "$log"' EXIT
          cargo test --locked --features qemu-validation --test qemu_validation > "$log" 2>&1
          n=$(grep -aoE 'test result: ok\. [0-9]+ passed' "$log" | awk '{s+=$4} END{print s+0}')
          echo "tests executed: $n (floor 22)"
          if [ "$n" -lt 22 ]; then
              echo "::error::only $n tests executed, floor is 22 — 24 ran on 2026-09-17 in run 35174965656, and a run that executes less than that stopped early rather than passed"
              exit 1
          fi
      # The test job's `--all-targets` no longer builds this target: its
      # [[test]] entry requires the feature (#50). So it is linted here,
      # where it is built.
      - name: clippy (qemu cross-validation tests)
        working-directory: rust-img-qcow2
        run: cargo clippy --locked --features qemu-validation --test qemu_validation -- -D warnings
