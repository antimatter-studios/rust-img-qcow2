[package]
name = "rust-img-qcow2"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust QCOW2 reader. Exposes a Rust API and a C ABI suitable for FFI from C/C++/Go/Swift."
repository = "https://github.com/antimatter-studios/rust-img-qcow2"

# The fuzz crate is its own package, on its own toolchain, and is not
# part of this one. Without this, `cargo package` and `cargo publish`
# try to include it and fail on the nightly-only dependency.
exclude = ["fuzz"]

# The name this crate had on crates.io: the semver check's baseline until
# a release exists under the new one (rust-fs-core's semver-check.sh).
[package.metadata.semver]
former-name = "am-img-qcow2"

[lib]
# Published as `rust-img-qcow2` on crates.io; consumers `use qcow2::...`
# inside their code. Decoupling the package name from the lib name keeps the
# brand-y prefix out of every import statement.
name = "img_qcow2"
crate-type = ["staticlib", "rlib"]

# THE COMMAND-LINE TOOL: one multi-call binary, named for the repository.
# It dispatches on argv[0], so the release step installs it once as
# `rust-img-qcow2` and links `img.qcow2` to it (cargo refuses a dot in a
# target name, so the dotted name is never cargo's). `rust-img-qcow2 img
# ...` is the form nothing else on PATH can shadow, and `cargo run
# --features cli -- img disk.qcow2 info` works before anything is installed.
#
# BEHIND THE `cli` FEATURE, so the static library a consumer links gains no
# dependency from the tool: `required-features` keeps the target out of a
# build that did not ask for it.
[[bin]]
name = "rust-img-qcow2"
path = "src/cli/main.rs"
required-features = ["cli"]

# WHAT THE RELEASE TARBALL SHIPS, read by rust-fs-core's package-cli.sh
# (`scripts/core.sh package-cli`), which release.yml reaches through core's
# release-cli workflow and ci.yml's `cli` job runs on every pull request.
# Each dotted name is a relative symlink to bin/rust-img-qcow2, with its man
# page in the section given here; the binary's own `generate names` must
# list exactly these, or the packaging fails. CAVEATS is the default,
# packaging/CAVEATS.
[package.metadata.package-cli]
names = { "img.qcow2" = 1 }
licenses = ["LICENSE"]

[features]
# The command-line tool and nothing else. The plumbing it shares with the
# family's other tools -- dispatch, --version, doctor, the output contract,
# man pages and completions -- is rust-fs-core's `cli` feature, turned on only
# here, so the static library gains nothing. clap is MIT/Apache-2.0.
cli = ["dep:clap", "rust-fs-core/cli"]
# Enables the qemu-img cross-validation test binary. Off by default so
# `cargo test` does not require qemu-img on PATH. CI installs qemu-utils
# and runs `cargo test --features qemu-validation --test qemu_validation`
# in a dedicated job. qemu-img is invoked as a subprocess only — never
# linked, never bundled into our release artifacts.
qemu-validation = []

# Without the feature `tests/qemu_validation.rs` compiles to an empty
# binary, and `cargo test --all-targets` ran it and printed `test result:
# ok. 0 passed` under the cross-validation suite's own name. Requiring the
# feature takes the target out of that run, so the line is absent rather
# than green. tests/feature_gated_targets.rs holds every feature-gated test
# target to this. See #50.
[[test]]
name = "qemu_validation"
path = "tests/qemu_validation.rs"
required-features = ["qemu-validation"]

[dependencies]
# Pure-Rust deflate backend (default when `default-features = true`).
# Used to decompress zlib-compressed clusters per the qcow2 spec.
flate2 = "1"
# Pure-Rust zstd decoder. Only used when an image declares
# compression_type = 1 (zstd) in its v3 header. MIT-licensed, no_std-able.
ruzstd = "0.8"
# Block-device trait surface. Local path dep until both crates are
# published; flip to a published version on the first crates.io release.
rust-fs-core = { path = "../rust-fs-core", version = "0.3.8" }
# The command-line tool's argument parser, behind the `cli` feature (see the
# `rust-img-qcow2` target above). No derive: the builder API keeps the tool's
# command a function the man pages and completions can be made from.
clap = { version = "4.5", optional = true, default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }

[dev-dependencies]
# YAML parser for tests/ci_profile.rs, which reads .github/workflows/ci.yml
# and refuses if the debug run that lets the PR gate see an arithmetic
# overflow has been removed or disabled. It PARSES the file rather than
# scanning its text: quoted keys, block scalars, comments and nested
# mappings are the grammar, not edge cases, and a guard that misreads
# its input reports protection it is not providing. Pure Rust, YAML 1.2
# (so GitHub's `on:` key stays the string `on` and is not folded into a
# boolean), MIT/Apache-2.0, and no C to transpile -- unlike serde_yaml,
# which is deprecated and wraps unsafe-libyaml. Dev-only: it never
# reaches a consumer of this crate. Same version as the siblings, so the
# copies of this guard stay one answer rather than several.
saphyr = "0.0.12"
# Partition probe + FS sniff, used by the `inspect` example to demonstrate
# the qcow2 -> partitions -> sniff stack.
#
# FROM THE REGISTRY, NOT FROM ../rust-partitions. chores.yml:11 says
# `staticlib` is the whole interface a consumer needs; as a path
# dependency this made that sentence false. Cargo builds the resolve
# graph for EVERY command, dev-dependencies included, so
# `cargo build --release` needed that directory on disk exactly as
# `cargo test` does. Measured on aac5d3d in a checkout carrying only
# ../rust-fs-core: exit 101 at the build step,
# `failed to read .../rust-partitions/Cargo.toml`.
#
# tests/siblings_the_contract_promises.rs refuses any path dependency on
# a sibling chores.yml does not declare, and CI no longer checks
# rust-partitions out, so a path here fails the build rather than
# quietly reinstating the prerequisite.
rust-disk-partitions = "0.6.0"
# Zstd encoder used only by the synthetic-image test harness to build
# fixture clusters; never linked into the runtime crate.
zstd = "0.13"
# JSON parsing for `qemu-img info --output=json` in the qemu-validation
# test harness. Test-only.
serde_json = "1"
# TOML parser for the two guards that read this manifest, both of which
# PARSE rather than scan -- which is the whole point of depending on a
# parser at all.
#
# tests/siblings_the_contract_promises.rs refuses a path dependency on an
# undeclared sibling: `path` is legal in four dependency tables, in
# `[target.'cfg(..)'.dependencies]` and in `[patch]`, and it can be
# spelled with either quote style, inline or as its own table.
#
# tests/header_names_the_built_library.rs reads `[lib] name` to check
# include/img_qcow2.h's link instruction: a hand-written reader there
# rejected single quotes, a trailing comment and a commented-out `[lib]`
# header, all of which are valid TOML this manifest is free to use.
#
# Dev-only: neither reaches a consumer of this crate.
toml = "1.1.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"  # required for catch_unwind at the C-ABI boundary

[profile.dev]
opt-level = 1
panic = "unwind"

# WHY A PATCH RATHER THAN A SECOND PATH DEPENDENCY.
#
# rust-disk-partitions comes from the registry (above), and its own rust-fs-core
# comes from the registry too. A registry rust-fs-core and this crate's
# ../rust-fs-core are DIFFERENT PACKAGES to cargo even at the same
# version, so without this the graph carries two of them and the
# `inspect` example stops compiling:
#
#     the trait `BlockRead` is not implemented for `Qcow2Reader`
#     note: there are multiple different versions of crate `fs_core`
#
# This unifies them onto the copy this crate already builds against. It
# needs no directory the contract does not already name, and cargo
# strips `[patch]` when packaging, so nothing reaches a consumer of the
# published crate. Adding a path here is adding a sibling prerequisite:
# ../rust-fs-core is declared in chores.yml, and the guard requires that
# of anything else put here.
[patch.crates-io]
rust-fs-core = { path = "../rust-fs-core" }

# The command-line tool's own write refusals, run against the built binary.
# It needs the `rust-img-qcow2` target, which needs `cli`; the debug and
# release tiers pass `--features cli`, so they build and run it.
[[test]]
name = "cli_write"
path = "tests/cli_write.rs"
required-features = ["cli"]
